<script>
  document.addEventListener('contextmenu', event => event.preventDefault());

  const ERROS_MAP = {
    1: "DOWNLOAD_ABORTADO (MEDIA_ERR_ABORTED)",
    2: "ERRO_DE_REDE (MEDIA_ERR_NETWORK)",
    3: "ERRO_DE_DECODIFICACAO (MEDIA_ERR_DECODE)",
    4: "MIDIA_NAO_SUPORTADA (MEDIA_ERR_SRC_NOT_SUPPORTED)"
  };

  let timeoutCarregamento = null;
  let timerReconexao = null;
  let tvLigada = false;
  let etapaFallback = 0;

  let travaMudancaMidia = false;
  let ultimaChaveMudanca = "";
  let dataGradeAtual = "";

  function obterChaveData(agora = new Date()) {
    return [
      agora.getFullYear(),
      String(agora.getMonth() + 1).padStart(2, '0'),
      String(agora.getDate()).padStart(2, '0')
    ].join('-');
  }

  function obterDiaDoAno(agora = new Date()) {
    const inicioDoDiaUTC = Date.UTC(
      agora.getFullYear(),
      agora.getMonth(),
      agora.getDate()
    );

    return Math.floor(inicioDoDiaUTC / (1000 * 60 * 60 * 24));
  }

  function obterChavePlaylist(programa) {
    if (!programa) return "";
    
    const id = Array.isArray(programa.idArchive)
      ? programa.idArchive.join("|")
      : String(programa.idArchive || "");

    return `${id}`;
  }

  function contarOcorrenciasNormaisAntesDaData(chavePlaylist, dataLimite) {
    const inicio = new Date(2020, 0, 1);
    const limite = new Date(
      dataLimite.getFullYear(),
      dataLimite.getMonth(),
      dataLimite.getDate()
    );
    let total = 0;

    for (
      let data = new Date(inicio);
      data < limite;
      data.setDate(data.getDate() + 1)
    ) {
      const siglaDia = DIAS_SEMANA[data.getDay()];

      GRADE_UNIFICADA.forEach(slot => {
        const progInfo = getSlotParaDia(slot, siglaDia);

        if (!progInfo || slot.repriseDe) return;

        const chave = Array.isArray(progInfo.id)
          ? progInfo.id.join('|')
          : String(progInfo.id || '');

        if (chave === chavePlaylist) total++;
      });
    }

    return total;
  }

  function contarOcorrenciasNormaisAnterioresNoDia(programa) {
    if (!programa) return 0;

    const chavePlaylist = obterChavePlaylist(programa);

    return gradeAutomated
      .slice(0, programa.indiceOcorrencia)
      .filter(outra =>
        !outra.repriseDe &&
        obterChavePlaylist(outra) === chavePlaylist
      )
      .length;
  }

  function prepararControleOcorrencias() {
    const contadores = {};

    gradeAutomated.forEach((programa, index) => {
      programa.ocorrenciaId = `${programa.h}-${index}`;
      programa.indiceOcorrencia = index;

      const chave = obterChavePlaylist(programa);

      if (!contadores[chave]) {
        contadores[chave] = 0;
      }

      programa.numeroOcorrenciaMesmoPrograma = contadores[chave];
      contadores[chave]++;

      programa.ehReprise = !!programa.repriseDe;
      programa.epIndexAtual = -1;
      programa.indiceInicialPlaylist = -1;
      programa.playlistPreparada = false;
      programa.ultimaDataPlaylist = "";
      programa.transicoesProtegidas = 0;
    });
  }

  function encontrarOcorrenciaAnteriorPorHorario(horario) {
    if (!horario) return null;

    const alvo = gradeAutomated.find(p => p.h === horario);

    if (!alvo) return null;

    return alvo;
  }

  function obterOcorrenciaFonteDaReprise(programa) {
    if (!programa || !programa.repriseDe) return null;

    const horarioReprise = horaParaMinutos(programa.h);

    const candidatas = gradeAutomated.filter(p => {
      if (p === programa) return false;
      if (p.h !== programa.repriseDe) return false;
      return horaParaMinutos(p.h) < horarioReprise;
    });

    if (candidatas.length > 0) {
      return candidatas[candidatas.length - 1];
    }

    const direta = encontrarOcorrenciaAnteriorPorHorario(programa.repriseDe);

    if (direta && direta !== programa) {
      return direta;
    }

    return null;
  }

  function calcularIndiceInicialOcorrencia(programa, quantidadeEpisodios) {
    if (!programa || quantidadeEpisodios <= 0) return 0;

    const diaDoAno = obterDiaDoAno();

    if (programa.repriseDe) {
      const fonte = obterOcorrenciaFonteDaReprise(programa);

      if (fonte && typeof fonte.epIndexAtual === 'number' && fonte.epIndexAtual >= 0) {
        return fonte.epIndexAtual % quantidadeEpisodios;
      }

      if (fonte) {
        return calcularIndiceInicialOcorrencia(
          fonte,
          quantidadeEpisodios
        );
      }
    }

    const chavePlaylist = obterChavePlaylist(programa);
    const dataHoje = new Date();
    const ocorrenciasAntes =
      contarOcorrenciasNormaisAntesDaData(
        chavePlaylist,
        dataHoje
      );
    const ocorrenciasAnterioresNoDia =
      contarOcorrenciasNormaisAnterioresNoDia(programa);

    return (
      ocorrenciasAntes +
      ocorrenciasAnterioresNoDia
    ) % quantidadeEpisodios;
  }

  function marcarEpisodioDaOcorrencia(programa, indice) {
    if (!programa) return;

    programa.epIndexAtual = indice;
    programa.indiceInicialPlaylist = indice;
    programa.playlistPreparada = true;
    programa.ultimaDataPlaylist = obterChaveData();
  }

  function garantirEpisodioDaOcorrencia(programa) {
    if (!programa || !programa.listaEpisodios || !programa.listaEpisodios.length) {
      return false;
    }

    const hoje = obterChaveData();

    if (
      programa.playlistPreparada &&
      programa.ultimaDataPlaylist === hoje &&
      programa.epIndexAtual >= 0
    ) {
      return true;
    }

    const indice = calcularIndiceInicialOcorrencia(
      programa,
      programa.listaEpisodios.length
    );

    marcarEpisodioDaOcorrencia(programa, indice);

    return true;
  }

  function obterEpisodioReprise(programa) {
    if (!programa || !programa.repriseDe) return null;

    const fonte = obterOcorrenciaFonteDaReprise(programa);

    if (!fonte) return null;

    if (
      fonte.playlistPreparada &&
      fonte.epIndexAtual >= 0 &&
      fonte.listaEpisodios &&
      fonte.listaEpisodios.length
    ) {
      const indice = fonte.epIndexAtual % programa.listaEpisodios.length;
      return indice;
    }

    const indice = calcularIndiceInicialOcorrencia(
      fonte,
      programa.listaEpisodios.length
    );

    return indice;
  }

  function prepararEpisodioDaOcorrencia(programa) {
    if (!programa || !programa.listaEpisodios || !programa.listaEpisodios.length) {
      return false;
    }

    const hoje = obterChaveData();

    if (
      programa.playlistPreparada &&
      programa.ultimaDataPlaylist === hoje &&
      programa.epIndexAtual >= 0
    ) {
      programa.u = programa.listaEpisodios[programa.epIndexAtual].url;
      return true;
    }

    if (programa.repriseDe) {
      const indiceReprise = obterEpisodioReprise(programa);

      if (
        typeof indiceReprise === 'number' &&
        indiceReprise >= 0
      ) {
        marcarEpisodioDaOcorrencia(programa, indiceReprise);
        programa.u = programa.listaEpisodios[indiceReprise].url;
        return true;
      }
    }

    garantirEpisodioDaOcorrencia(programa);

    if (
      programa.epIndexAtual >= 0 &&
      programa.listaEpisodios[programa.epIndexAtual]
    ) {
      programa.u = programa.listaEpisodios[programa.epIndexAtual].url;
      return true;
    }

    return false;
  }

  function mudarParaEpisodioSeguinte(programa, indice) {
    if (!programa || !programa.listaEpisodios || !programa.listaEpisodios.length) {
      return false;
    }

    const agora = new Date();

    let novoIndice;

    if (programa.epIndexAtual < 0) {
      novoIndice = 0;
    } else {
      novoIndice =
        (programa.epIndexAtual + 1) %
        programa.listaEpisodios.length;
    }

    programa.epIndexAtual = novoIndice;
    programa.u = programa.listaEpisodios[novoIndice].url;

    programa.ultimaDataPlaylist = obterChaveData(agora);
    programa.playlistPreparada = true;
    programa.transicoesProtegidas++;

    return true;
  }

  function podeMudarMidia(chave) {
    const agora = Date.now();

    if (
      travaMudancaMidia &&
      ultimaChaveMudanca === chave
    ) {
      return false;
    }

    travaMudancaMidia = true;
    ultimaChaveMudanca = chave;

    setTimeout(() => {
      travaMudancaMidia = false;
    }, 1000);

    return true;
  }

    const agora = new Date();
    const h = String(agora.getHours()).padStart(2, '0');
    const m = String(agora.getMinutes()).padStart(2, '0');
    const s = String(agora.getSeconds()).padStart(2, '0');

    document.getElementById('clock').innerText = `${h}:${m}`;

    if (h === '06' && m === '00' && s === '00') {
      console.log("⏰ 06:00 da manhã! Reativando sinal da transmissão...");
      inicializarGradeAutomatica();
    }
  }

  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  function criarEpisodiosVirtuaisLigaDaJustica(
    nomeArquivo,
    duracaoVideo,
    servidor
  ) {
    /*
     * EDIÇÃO 1 APLICADA:
     * Se os metadados informarem o servidor do item,
     * usamos a URL direta do nó correto (ex.: ia601507),
     * evitando o fallback e o HTTP 464.
     */
    const urlVideo =
      (servidor && servidor.host && servidor.dir)
        ? `https://${servidor.host}${servidor.dir}/${encodeURIComponent(nomeArquivo)}`
        : `https://archive.org/download/${LIGA_DA_JUSTICA_ID}/${encodeURIComponent(nomeArquivo)}`;

    return LIGA_DA_JUSTICA_TIMESTAMPS.map((ep, index) => {
      const proximo = LIGA_DA_JUSTICA_TIMESTAMPS[index + 1];
      const fim = proximo
        ? proximo.inicio
        : duracaoVideo > ep.inicio
          ? duracaoVideo
          : ep.inicio + 30 * 60;

      return {
        titulo: ep.titulo,
        url: urlVideo,
        duracao: Math.max(0, fim - ep.inicio),
        inicio: ep.inicio,
        fim,
        segmentoLigaDaJustica: true
      };
    });
  }

  let gradeAutomated = [];
  let indiceAtual = -1;

  function converterParaSegundos(val) {
    if (!val) return 0;
    if (typeof val === 'number') return val;

    if (typeof val === 'string') {
      if (val.includes(':')) {
        const partes = val.split(':').map(Number);

        if (partes.length === 3) {
          return partes[0] * 3600 + partes[1] * 60 + partes[2];
        }

        if (partes.length === 2) {
          return partes[0] * 60 + partes[1];
        }
      }

      return parseFloat(val) || 0;
    }

    return 0;
  }

  function horaParaMinutos(horarioStr) {
    const [h, m] = horarioStr.split(':').map(Number);
    return h * 60 + m;
  }
  function limparTimerReconexao() {
    if (timerReconexao) {
      clearInterval(timerReconexao);
      timerReconexao = null;
    }
  }

  function toggleGrade() {
    const box = document.getElementById('grade-box-container');

  function atualizarListaGrade() {
    const container = document.getElementById('grade-lista');
    if (!container) return;

    container.innerHTML = gradeAutomated.map((item, i) => `
      <div class="grade-item ${i === indiceAtual ? 'ativo' : ''}">
        <span>
          <b>${item.h}</b> - ${item.n}
          ${item.repriseDe ? ' ↩️' : ''}
        </span>
        ${i === indiceAtual ? '<span>🔴 NO AR</span>' : ''}
      </div>
    `).join('');

    atualizarAseguirLista();
  }

  function atualizarAseguirLista() {
    const container = document.getElementById('a-seguir-lista');
    if (!container) return;

    const proximos = gradeAutomated.slice(
      indiceAtual + 1,
      indiceAtual + 5
    );
    
    if (proximos.length === 0) {
      container.innerHTML =
        `<div class="a-seguir-item">
          <span>Transmissão encerrada por hoje.</span>
        </div>`;
      return;
    }

    container.innerHTML = proximos.map(p => `
      <div class="a-seguir-item">
        <span class="a-seguir-time">${p.h}</span>
        <span class="badge-classif">L</span>

          ${p.n}${p.repriseDe ? ' ↩️' : ''}
        </span>
      </div>
    `).join('');

  async function carregarVideosArchive(idAlvo) {
    const colecoes =
      Array.isArray(idAlvo)
        ? idAlvo
        : [idAlvo];
    
    const requisicoes = colecoes.map(async (id) => {

      // A Liga da Justiça é um único MP4 com 26 episódios.
      // Não deixamos o carregador tratar o vídeo de 9 horas como um
      // único episódio; criamos episódios virtuais pelos timestamps.
      if (ehLigaDaJusticaId(id)) {
        try {
          const maxTentativasLiga = 3;
          let respostaLiga = null;

          for (
            let tentativaLiga = 1;
            tentativaLiga <= maxTentativasLiga;
            tentativaLiga++
          ) {
            try {
              let urlAPILiga =
                `https://archive.org/metadata/${id}`;

              if (tentativaLiga === maxTentativasLiga) {
                urlAPILiga =
                  `https://api.allorigins.win/raw?url=${encodeURIComponent(urlAPILiga)}`;
              }

              respostaLiga = await fetch(urlAPILiga);

              if (respostaLiga.ok) break;
            } catch (e) {
              if (tentativaLiga < maxTentativasLiga) {
                await new Promise(r => setTimeout(r, 1000));
              }
            }
          }

          if (!respostaLiga || !respostaLiga.ok) return [];

          const dadosLiga = await respostaLiga.json();

          const candidatosLiga = (dadosLiga.files || [])
            .filter(f =>
              f &&
              f.name &&
              f.name.toLowerCase().endsWith('.mp4') &&
              !f.name.endsWith('_thumb.mp4')
            )
            .sort((a, b) =>
              converterParaSegundos(b.length) -
              converterParaSegundos(a.length)
            );

          if (!candidatosLiga.length) return [];

          const arquivoLiga = candidatosLiga[0];
          const duracaoVideo = converterParaSegundos(arquivoLiga.length);

          /*
           * EDIÇÃO 2 APLICADA:
           * Passamos o servidor real do item para montar
           * a URL direta (evita HTTP 464 do servidor chumbado).
           */
          return criarEpisodiosVirtuaisLigaDaJustica(
            arquivoLiga.name,
            duracaoVideo,
            {
              host: dadosLiga.server,
              dir: dadosLiga.dir
            }
          );

        } catch (erroLiga) {
          console.error(
            'Erro ao carregar Liga da Justiça:',
            erroLiga
          );
          return [];
        }
      }
      const maxTentativas = 3;
      let resposta = null;

      for (
        let tentativa = 1;
        tentativa <= maxTentativas;
        tentativa++
      ) {
        try {
          let urlAPI =
            `https://archive.org/metadata/${id}`;

          if (tentativa === maxTentativas) {
            urlAPI =
              `https://api.allorigins.win/raw?url=${encodeURIComponent(urlAPI)}`;
          }

          resposta = await fetch(urlAPI);

          if (resposta.ok) break;

        } catch (e) {
          if (tentativa < maxTentativas) {
            await new Promise(r =>
              setTimeout(r, 1000)
            );
          }
        }
      }

      try {
        if (resposta && resposta.ok) {
          const dadosMeta =
            await resposta.json();

          if (dadosMeta.files) {

            let arquivos =
              dadosMeta.files.filter(f => {

                if (!f.name ||
                    f.name.endsWith('_thumb.mp4')) {
                  return false;
                }

                if (!f.name.toLowerCase().endsWith('.mp4')) {
                  return false;
                }

                if (
                  f.name.includes('512kb') ||
                  f.name.includes('_low') ||
                  f.name.includes('audio_only')
                ) {
                  return false;
                }
                
                const formatosComAudio = [
                  'h.264',
                  'MPEG4',
                  'AAC',
                  'MP3',
                  '512Kb MPEG4',
                  'MPEG-4'
                ];

                if (
                  f.format &&
                  !formatosComAudio.some(
                    fmt => f.format.includes(fmt)
                  )
                ) {
                  if (
                    ['webm', 'ogg'].some(
                      ext =>
                        f.format
                          .toLowerCase()
                          .includes(ext)
                    )
                  ) {
                    return false;
                  }
                }
                
                const dur =
                  converterParaSegundos(f.length);

                if (dur > 0 && dur < 180) {
                  return false;
                }
              
                return true;
              });

            if (arquivos.length === 0) {
              arquivos =
                dadosMeta.files.filter(f =>
                  f.name &&
                  f.name
                    .toLowerCase()
                    .endsWith('.mp4') &&
                  !f.name.endsWith('_thumb.mp4')
                );
            }
            
            /*
             * .mp4 e .ia.mp4 podem ser duas cópias do mesmo episódio.
             * Mantemos apenas uma entrada na playlist para que a cópia
             * leve não seja contada como um episódio adicional.
             * A versão .ia.mp4 é preservada quando estiver disponível.
             */
            const arquivosPorEpisodio = new Map();

            arquivos.forEach(arquivo => {
              const nome = String(arquivo.name || '');
              const chave = nome
                .replace(/\.ia\.mp4$/i, '.mp4')
                .toLowerCase();
              const anterior = arquivosPorEpisodio.get(chave);
              const atualEhIa = /\.ia\.mp4$/i.test(nome);
              const anteriorEhIa = anterior &&
                /\.ia\.mp4$/i.test(String(anterior.name || ''));

              if (!anterior || (atualEhIa && !anteriorEhIa)) {
                arquivosPorEpisodio.set(chave, arquivo);
              }
            });

            arquivos = Array.from(arquivosPorEpisodio.values());

            let eps =
              arquivos
                .filter(f => {
                  const dur =
                    converterParaSegundos(f.length);

                  if (dur > 0 && dur < 240) {
                    return false;
                  }

                  if (
                    id === "YuYuHakushoDublado" &&
                    dur > 2700
                  ) {
                    return false;
                  }

                  if (
                    id === "a-grande-familia-dvd" &&
                    dur < 1500
                  ) {
                    return false;
                  }

                  return true;
                })
                .sort((a, b) =>
                  a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                      numeric: true,
                      sensitivity: 'base'
                    }
                  )
                );

            if (
              id === "naruto-shippuuden-021-720p"
            ) {
              eps = eps.slice(0, 79);
            }

            return eps.map(f => ({
              titulo:
                f.title ||
                f.name.replace(
                  /(\.ia)?\.mp4$/i,
                  ''
                ),
              url:
                `https://archive.org/download/${id}/${encodeURIComponent(f.name)}`,
              duracao:
                converterParaSegundos(f.length)
            }));
          }
        }

        return [];

      } catch (erro) {
        return [];
      }
    });

    const resultados =
      await Promise.all(requisicoes);

    return resultados.flat();
  }

  function getSlotParaDia(slot, siglaDia) {
    if (
      slot.exceto &&
      Object.prototype.hasOwnProperty.call(
        slot.exceto,
        siglaDia
      )
    ) {
      return slot.exceto[siglaDia];
    }

    return slot.padrao;
  }

  function getDuracaoParaDia(slot, siglaDia) {
    if (typeof slot.dur === 'number') {
      return slot.dur;
    }

    if (slot.dur[siglaDia]) {
      return slot.dur[siglaDia];
    }

    return slot.dur.padrao;
  }

  async function inicializarGradeAutomatica() {
    gradeAutomated = [];

    const hoje = new Date();
    const diaDaSemana =
      DIAS_SEMANA[hoje.getDay()];

    GRADE_UNIFICADA.forEach((slot) => {

      const progInfo =
        getSlotParaDia(
          slot,
          diaDaSemana
        );

      if (!progInfo) return;

      const mInicio =
        horaParaMinutos(progInfo.h ?? slot.h);

      const duracao =
        getDuracaoParaDia(
          slot,
          diaDaSemana
        );

      const mFim =
        mInicio + duracao;

      gradeAutomated.push({
        h: slot.h,
        m: mInicio,
        mFim: mFim,
        n: progInfo.n,
        u: URL_VIDEO_INTERVALO,
        idArchive: progInfo.id,
        listaEpisodios: [],
        epIndexAtual: -1,

        repriseDe: slot.repriseDe || null,

        ocorrenciaId: "",
        numeroOcorrenciaMesmoPrograma: 0,
        indiceInicialPlaylist: -1,
        playlistPreparada: false,
        ultimaDataPlaylist: "",
        ehReprise: !!slot.repriseDe,
        ehLigaDaJustica: ehLigaDaJusticaId(progInfo.id),
        transicoesProtegidas: 0
      });
    });

    gradeAutomated.sort(
      (a, b) => a.m - b.m
    );

    prepararControleOcorrencias();

    dataGradeAtual =
      obterChaveData(hoje);

    atualizarListaGrade();

    const player =
      document.getElementById('player');

    if (player) {
      player.onended = function() {

        if (!player.loop) {
          tocarProximoEpisodioSemCorte();
        }
      };
    }

    iniciarTransmissaoInicial();
  }

  function encerrarSinalMadrugada() {
    limparTimerReconexao();

    document.getElementById(
      'current-time'
    ).innerText = "--:--";

    document.getElementById(
      'current'
    ).innerText = "Transmissão Encerrada";

    document.getElementById(
      'a-seguir-lista'
    ).innerHTML =
      `<div class="a-seguir-item">
        <span class="a-seguir-time">06:00</span>
        <span class="a-seguir-name">
          Novo Telecurso
        </span>
      </div>`;
    
    const player =
      document.getElementById('player');

    if (player) {
      player.loop = false;
      player.pause();
      player.removeAttribute('src');
      player.load();
    }
  }

  async function iniciarTransmissaoInicial() {
    const agora = new Date();

    const minutosHoje =
      agora.getHours() * 60 +
      agora.getMinutes();

    if (
      minutosHoje >= horaParaMinutos("23:00") ||
      minutosHoje < horaParaMinutos("06:00")
    ) {
      encerrarSinalMadrugada();
      return;
    }

    indiceAtual =
      gradeAutomated.findIndex(
        p =>
          minutosHoje >= p.m &&
          minutosHoje < p.mFim
      );

    if (indiceAtual !== -1) {

      const programa =
        gradeAutomated[indiceAtual];

      document.getElementById(
        'current-time'
      ).innerText = programa.h;

      document.getElementById(
        'current'
      ).innerText = programa.n;

      atualizarListaGrade();

      const episodios =
        await carregarVideosArchive(
          programa.idArchive
        );

      if (episodios.length > 0) {

        programa.listaEpisodios =
          episodios;

        prepararEpisodioDaOcorrencia(
          programa
        );
      }

      executarMidia(
        indiceAtual,
        true
      );

    } else {

      const proximoPrograma =
        gradeAutomated.find(
          p => p.m > minutosHoje
        );

      if (proximoPrograma) {

        const programaAnterior =
          gradeAutomated
            .slice()
            .reverse()
            .find(
              p =>
                p.mFim <= minutosHoje
            );

        let tempoDecorrido = 0;

        if (programaAnterior) {

          const segundosHoje =
            agora.getHours() * 3600 +
            agora.getMinutes() * 60 +
            agora.getSeconds();

          tempoDecorrido =
            segundosHoje -
            (programaAnterior.mFim * 60);
        }

        exibirTelaIntervalo(
          proximoPrograma,
          tempoDecorrido
        );

      } else {
        encerrarSinalMadrugada();
      }
    }
  }

  function tocarProximoEpisodioSemCorte() {
    const agora = new Date();

    const segundosHoje =
      agora.getHours() * 3600 +
      agora.getMinutes() * 60 +
      agora.getSeconds();

    const limiteNoite =
      horaParaMinutos("23:00") * 60;

    const programaAtual =
      gradeAutomated[indiceAtual];

    // A Liga da Justiça tem episódios segmentados dentro do mesmo MP4.
    // O fim do segmento é tratado por timeupdate; nunca avançamos para
    // outro episódio dentro do mesmo bloco de 30 minutos aqui.
    if (
      programaAtual &&
      ehLigaDaJusticaPrograma(programaAtual)
    ) {
      const proximoPrograma = gradeAutomated[indiceAtual + 1];

      if (segundosHoje < limiteNoite) {
        if (proximoPrograma) {
          exibirTelaIntervalo(proximoPrograma, 0);
        } else {
          encerrarSinalMadrugada();
        }
      } else {
        encerrarSinalMadrugada();
      }
      return;
    }

    if (
      programaAtual &&
      segundosHoje <
      (programaAtual.mFim * 60)
    ) {

      const segundosRestantesNoBloco =
        (programaAtual.mFim * 60) -
        segundosHoje;

      if (
        programaAtual.listaEpisodios &&
        programaAtual.listaEpisodios.length > 1
      ) {

        let epEncontradoIndex = -1;

        const proximoIndexPadrao =
          (
            programaAtual.epIndexAtual + 1
          ) %
          programaAtual.listaEpisodios.length;

        const proximoEpPadrao =
          programaAtual.listaEpisodios[
            proximoIndexPadrao
          ];

        const duracaoPadrao =
          proximoEpPadrao.duracao > 0
            ? proximoEpPadrao.duracao
            : 420;

        if (
          duracaoPadrao <=
          segundosRestantesNoBloco
        ) {
          epEncontradoIndex =
            proximoIndexPadrao;

        } else {

          for (
            let i = 0;
            i <
            programaAtual.listaEpisodios.length;
            i++
          ) {

            const testEp =
              programaAtual.listaEpisodios[i];

            const duracaoTest =
              testEp.duracao > 0
                ? testEp.duracao
                : 420;

            if (
              duracaoTest <=
              segundosRestantesNoBloco
            ) {
              epEncontradoIndex = i;
              break;
            }
          }
        }

        if (
          epEncontradoIndex !== -1
        ) {

          const chave =
            `${programaAtual.ocorrenciaId}:ep:${epEncontradoIndex}`;

          if (!podeMudarMidia(chave)) {
            return;
          }

          programaAtual.epIndexAtual =
            epEncontradoIndex;

          programaAtual.u =
            programaAtual
              .listaEpisodios[
                epEncontradoIndex
              ].url;

          programaAtual.playlistPreparada = true;
          programaAtual.ultimaDataPlaylist =
            obterChaveData(agora);

          programaAtual.transicoesProtegidas++;

          executarMidia(
            indiceAtual,
            false
          );

          return;
        }
      }
    }

    const proximoIndice =
      indiceAtual + 1;

    const proximoPrograma =
      gradeAutomated[proximoIndice];

    if (segundosHoje < limiteNoite) {

      if (proximoPrograma) {

        exibirTelaIntervalo(
          proximoPrograma,
          0
        );

      } else {

        exibirTelaIntervalo(
          {
            h: "23:00",
            m: 1380,
            n: "Transmissão Encerrada"
          },
          0
        );
      }

    } else {
      encerrarSinalMadrugada();
    }
  }

  function exibirTelaIntervalo(
    proximoPrograma,
    tempoDecorridoIntervalo = 0
  ) {

    if (timeoutCarregamento) {
      clearTimeout(
        timeoutCarregamento
      );
    }

    etapaFallback = 0;
    
    document.getElementById(
      'current-time'
    ).innerText = "--:--";

    document.getElementById(
      'current'
    ).innerText =
      "Intervalo Comercial";
    
    const player =
      document.getElementById('player');
    
    player.onerror = function() {
      player.onerror = null;
    };

    player.loop = true;
    player.removeAttribute(
      'crossorigin'
    );

    player.src =
      URL_VIDEO_INTERVALO;
    
    player.muted = false;
    player.volume = 1.0;
    
    if (tempoDecorridoIntervalo > 0) {

      player.addEventListener(
        'loadedmetadata',
        function() {

          if (player.duration > 0) {
            player.currentTime =
              tempoDecorridoIntervalo %
              player.duration;
          }

          if (tvLigada) {

            player.play()
              .then(() => {
                player.muted = false;
              })
              .catch(() => {});
          }

        },
        { once: true }
      );

    } else {

      if (tvLigada) {

        player.play()
          .then(() => {
            player.muted = false;
          })
          .catch(() => {});
      }
    }

    const checarIntervalo =
      setInterval(
        async () => {

          const agora = new Date();

          const minutosHoje =
            agora.getHours() * 60 +
            agora.getMinutes();

          if (
            minutosHoje >=
            proximoPrograma.m
          ) {

            clearInterval(
              checarIntervalo
            );

            limparTimerReconexao();

            player.loop = false;

            indiceAtual =
              gradeAutomated.indexOf(
                proximoPrograma
              );

            if (
              !proximoPrograma.listaEpisodios ||
              proximoPrograma.listaEpisodios.length === 0
            ) {

              const episodios =
                await carregarVideosArchive(
                  proximoPrograma.idArchive
                );

              if (episodios.length > 0) {

                proximoPrograma.listaEpisodios =
                  episodios;

                prepararEpisodioDaOcorrencia(
                  proximoPrograma
                );
              }

            } else {
              prepararEpisodioDaOcorrencia(
                proximoPrograma
              );
            }

            executarMidia(
              indiceAtual,
              false
            );
          }

        },
        3000
      );
  }

  function tentarReconectarProgramaEmSegundoPlano(
    programa,
    index
  ) {

    limparTimerReconexao();

    timerReconexao =
      setInterval(
        async () => {

          const agora = new Date();

          const minutosHoje =
            agora.getHours() * 60 +
            agora.getMinutes();

          if (
            minutosHoje >=
            programa.mFim
          ) {
            limparTimerReconexao();
            return;
          }

          const idAlvo =
            programa.idArchive;

          const novosEpisodios =
            await carregarVideosArchive(
              idAlvo
            );

          if (
            novosEpisodios &&
            novosEpisodios.length > 0
          ) {

            limparTimerReconexao();

            programa.listaEpisodios =
              novosEpisodios;

            prepararEpisodioDaOcorrencia(
              programa
            );

            executarMidia(
              index,
              true
            );
          }

        },
        30000
      );
  }
  function aplicarEstrategiaFallback(
    programa,
    index
  ) {

    if (timeoutCarregamento) {
      clearTimeout(
        timeoutCarregamento
      );
    }

    etapaFallback++;

    const player =
      document.getElementById('player');

    const urlOriginal =
      programa.listaEpisodios &&
      programa.listaEpisodios.length > 0
        ? programa
            .listaEpisodios[
              programa.epIndexAtual >= 0
                ? programa.epIndexAtual
                : 0
            ].url
        : programa.u;

    if (etapaFallback === 1) {

      player.src =
        `${urlOriginal}?retry=${Date.now()}`;

    } else if (etapaFallback === 2) {

      /*
       * EDIÇÃO 3 APLICADA:
       * Consulta o servidor real do item nos metadados,
       * em vez de chumbar um servidor fixo (ia801501).
       * Funciona para TODAS as coleções da grade.
       */
      const idDoItem =
        urlOriginal
          .replace("https://archive.org/download/", "")
          .split("/")[0];
      const nomeDoArquivo =
        urlOriginal.split("/").pop();

      fetch(
        `https://archive.org/metadata/${idDoItem}`
      )
        .then(function(resposta) {
          return resposta.json();
        })
        .then(function(meta) {
          if (meta && meta.server && meta.dir) {
            player.src =
              `https://${meta.server}${meta.dir}/${encodeURIComponent(nomeDoArquivo)}`;
          } else {
            player.src = urlOriginal;
          }
          player.load();
          player.play().catch(function() {});
        })
        .catch(function() {
          player.src = urlOriginal;
          player.load();
        });

    } else if (etapaFallback === 3) {

      /*
       * EDIÇÃO 4 APLICADA:
       * A Liga da Justiça não tem versões alternativas
       * (_640 / proxy). Volta para a URL original
       * e desiste do fallback sem travar no proxy.
       */
      if (
        urlOriginal.includes(LIGA_DA_JUSTICA_ID)
      ) {
        etapaFallback = 0;
        tratarErroOuDemora(programa);
        return;
      }

      const urlAlternativa =
        urlOriginal.replace(
          /(_512|\.ia)\.mp4$/,
          '_640.mp4'
        );

      if (
        urlAlternativa !==
        urlOriginal
      ) {

        console.log(
          "Tentando versão alternativa com áudio:",
          urlAlternativa
        );

        player.src =
          urlAlternativa;

      } else {

        player.src =
          `https://api.allorigins.win/raw?url=${encodeURIComponent(urlOriginal)}`;
      }

    } else {

      etapaFallback = 0;

      tratarErroOuDemora(
        programa
      );

      return;
    }

    timeoutCarregamento =
      setTimeout(
        () => {

          if (player.readyState === 0) {
            aplicarEstrategiaFallback(
              programa,
              index
            );
          }

        },
        STEP_TIMEOUT_MS
      );
  }

  function executarMidia(
    index,
    sincronizarSegundos
  ) {

    limparTimerReconexao();

    const programa =
      gradeAutomated[index];

    if (!programa) return;

    let episodioAtualSelecionado = null;

    if (
      programa.listaEpisodios &&
      programa.listaEpisodios.length > 0
    ) {
      prepararEpisodioDaOcorrencia(programa);
      episodioAtualSelecionado =
        programa.listaEpisodios[programa.epIndexAtual] || null;
    }

    if (programa._ligaTimeupdateHandler) {
      const playerAnterior = document.getElementById('player');
      if (playerAnterior) {
        playerAnterior.removeEventListener(
          'timeupdate',
          programa._ligaTimeupdateHandler
        );
      }
      programa._ligaTimeupdateHandler = null;
    }

    if (
      programa.listaEpisodios &&
      programa.listaEpisodios.length > 0
    ) {
      if (!episodioAtualSelecionado) {
        prepararEpisodioDaOcorrencia(programa);
        episodioAtualSelecionado =
          programa.listaEpisodios[programa.epIndexAtual] || null;
      }

      if (episodioAtualSelecionado) {
        programa.u = episodioAtualSelecionado.url;
      }
    }

    const player =
      document.getElementById('player');

    player.loop = false;

    player.removeAttribute(
      'crossorigin'
    );

    document.getElementById(
      'current-time'
    ).innerText =
      programa.h;

    document.getElementById(
      'current'
    ).innerText =
      programa.n;

    atualizarListaGrade();

    if (timeoutCarregamento) {
      clearTimeout(
        timeoutCarregamento
      );
    }

    player.onerror = function() {

      if (
        player.src &&
        player.src.includes(
          URL_VIDEO_INTERVALO
        )
      ) {
        return;
      }

      const err =
        player.error;

      const errCode =
        err ? err.code : 0;

      if (
        errCode === 2 &&
        etapaFallback < 3
      ) {
        etapaFallback = 2;
      }

      aplicarEstrategiaFallback(
        programa,
        index
      );
    };

    /*
     * EDIÇÃO 5 APLICADA:
     * 90s para episódios longos (> 50 min),
     * 30s para o restante.
     */
    const epParaTimeout =
      programa.listaEpisodios &&
      programa.listaEpisodios[programa.epIndexAtual];

    const timeoutEfetivo =
      epParaTimeout && epParaTimeout.duracao > 3000
        ? 90000
        : STEP_TIMEOUT_MS;

    timeoutCarregamento =
      setTimeout(
        () => {

          if (player.readyState === 0) {

            aplicarEstrategiaFallback(
              programa,
              index
            );
          }

        },
        timeoutEfetivo
      );

    player.oncanplay = function() {

      if (timeoutCarregamento) {
        clearTimeout(
          timeoutCarregamento
        );
      }

      etapaFallback = 0;

      setTimeout(() => {

        if (player.muted) {

          player.muted = false;

          console.log(
            "Desmutando player automaticamente."
          );
        }

      }, 500);
    };

    if (etapaFallback === 0) {
      player.src = programa.u;
    }

    player.muted = false;
    player.volume = 1.0;

    // ============================================================
    // LIGA DA JUSTIÇA: reproduz somente o segmento do episódio.
    // ============================================================
    if (
      ehLigaDaJusticaPrograma(programa) &&
      episodioAtualSelecionado &&
      episodioAtualSelecionado.segmentoLigaDaJustica
    ) {
      const episodio = episodioAtualSelecionado;

      const finalizarSegmentoLiga = () => {
        if (programa._ligaTimeupdateHandler) {
          player.removeEventListener(
            'timeupdate',
            programa._ligaTimeupdateHandler
          );
          programa._ligaTimeupdateHandler = null;
        }

        const proximoPrograma =
          gradeAutomated[index + 1];

        if (proximoPrograma) {
          exibirTelaIntervalo(proximoPrograma, 0);
        } else {
          encerrarSinalMadrugada();
        }
      };

      let segmentoLigaIniciado = false;

      const iniciarSegmentoLiga = () => {
        if (segmentoLigaIniciado) return;
        segmentoLigaIniciado = true;

        const agoraSegmento = new Date();
        const minutosAgora =
          agoraSegmento.getHours() * 60 +
          agoraSegmento.getMinutes();
        const segundosAgora =
          agoraSegmento.getSeconds();

        const decorridosDesdeInicio =
          ((minutosAgora - programa.m) * 60) +
          segundosAgora;

        if (decorridosDesdeInicio < 0) {
          player.currentTime = episodio.inicio;
        } else if (decorridosDesdeInicio >= episodio.duracao) {
          finalizarSegmentoLiga();
          return;
        } else {
          player.currentTime =
            episodio.inicio + decorridosDesdeInicio;
        }

        programa._ligaTimeupdateHandler = () => {
          if (!player.duration || !episodio.fim) return;

          if (player.currentTime >= episodio.fim - 0.15) {
            player.currentTime = episodio.fim;
            finalizarSegmentoLiga();
          }
        };

        player.addEventListener(
          'timeupdate',
          programa._ligaTimeupdateHandler
        );

        if (tvLigada) {
          player.play()
            .then(() => {
              player.muted = false;
            })
            .catch(() => {});
        }
      };

      player.addEventListener(
        'loadedmetadata',
        iniciarSegmentoLiga,
        { once: true }
      );

      // No bloco de origem (como 11:30), inicia no começo do episódio.
      // Em entrada tardia na página, o ponto é calculado acima.
      if (player.readyState >= 1) {
        iniciarSegmentoLiga();
      }

      return;
    }

    if (sincronizarSegundos) {

      const agora = new Date();

      const minutosHoje =
        agora.getHours() * 60 +
        agora.getMinutes();

      const segundosHoje =
        agora.getSeconds();

      const minutosDecorridos =
        minutosHoje -
        programa.m;

      const segundosDecorridos =
        (minutosDecorridos * 60) +
        segundosHoje;

      player.addEventListener(
        'loadedmetadata',
        function() {

          if (
            segundosDecorridos >=
            player.duration
          ) {

            const proximoPrograma =
              gradeAutomated[
                index + 1
              ];

            const tempoDecorridoIntervalo =
              segundosDecorridos -
              player.duration;

            if (proximoPrograma) {

              exibirTelaIntervalo(
                proximoPrograma,
                tempoDecorridoIntervalo
              );

            } else {

              const limiteNoite =
                horaParaMinutos(
                  "23:00"
                ) * 60;

              const segHoje =
                agora.getHours() * 3600 +
                agora.getMinutes() * 60 +
                agora.getSeconds();

              if (
                segHoje <
                limiteNoite
              ) {

                exibirTelaIntervalo(
                  {
                    h: "23:00",
                    m: 1380,
                    n: "Transmissão Encerrada"
                  },
                  tempoDecorridoIntervalo
                );

              } else {
                encerrarSinalMadrugada();
              }
            }

          } else if (
            segundosDecorridos > 0
          ) {

            player.currentTime =
              segundosDecorridos;

            if (tvLigada) {

              player.play()
                .then(() => {
                  player.muted = false;
                })
                .catch(() => {});
            }
          }

        },
        { once: true }
      );

    } else {

      if (tvLigada) {

        player.play()
          .then(() => {
            player.muted = false;
          })
          .catch(() => {});
      }
    }
  }

  function tratarErroOuDemora(
    programa
  ) {

    if (timeoutCarregamento) {
      clearTimeout(
        timeoutCarregamento
      );
    }

    etapaFallback = 0;

    const index =
      gradeAutomated.indexOf(
        programa
      );

    const proximoPrograma =
      gradeAutomated[
        index + 1
      ];
    
    const agora =
      new Date();

    const segundosHoje =
      agora.getHours() * 3600 +
      agora.getMinutes() * 60 +
      agora.getSeconds();

    const limiteNoite =
      horaParaMinutos(
        "23:00"
      ) * 60;

    if (
      segundosHoje <
      limiteNoite
    ) {

      if (proximoPrograma) {

        exibirTelaIntervalo(
          proximoPrograma,
          0
        );

      } else {

        exibirTelaIntervalo(
          {
            h: "23:00",
            m: 1380,
            n: "Transmissão Encerrada"
          },
          0
        );
      }

      tentarReconectarProgramaEmSegundoPlano(
        programa,
        index
      );

    } else {
      encerrarSinalMadrugada();
    }
  }

  function ligarTelevisao() {

    tvLigada = true;

    document.getElementById(
      'tela-start'
    ).style.display = 'none';

    const player =
      document.getElementById('player');
    
    player.muted = false;
    player.volume = 1.0;
    
    player.play()
      .then(() => {
        player.muted = false;
      })
      .catch(() => {});
  }

  function toggleFullScreen() {

    const modulo =
      document.getElementById(
        'modulo-tv'
      );

    if (
      !document.fullscreenElement &&
      !document.webkitFullscreenElement
    ) {

      if (modulo.requestFullscreen) {
        modulo.requestFullscreen();

      } else if (
        modulo.webkitRequestFullscreen
      ) {
        modulo.webkitRequestFullscreen();
      }

    } else {

      if (document.exitFullscreen) {
        document.exitFullscreen();

      } else if (
        document.webkitExitFullscreen
      ) {
        document.webkitExitFullscreen();
      }
    }
  }

  window.addEventListener(
    'DOMContentLoaded',
    inicializarGradeAutomatica
  );
</script>
