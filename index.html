      exceto: { sab: { n: "Wolverine (Anime)", id: "wolverine-anime-dublado" } }
    },
    { h: "21:00", dur: 30, padrao: { n: "Futurama", id: "fut01" } },
    {
      h: "21:30",
      dur: 30,
      padrao: { n: "Batman: Os Bravos e os Destemidos", id: "batman-os-bravos-e-destemidos-2008-2011" },
      exceto: { ter: { n: "Batman: A Série Animada", id: "desenhos-batman-a-serie-animada-19921995" }, qui: { n: "As Novas Aventuras do Batman", id: "desenhos-as-novas-aventuras-do-batman-19971999" } }
    },
    {
      h: "22:00",
      dur: 60,
      padrao: { n: "Stranger Things", id: ["PaixaoFlix-Stranger-Things-2016-1a-Temporada", "PaixaoFlix-Stranger-Things-2017-2a-Temporada", "PaixaoFlix-Stranger-Things-3a-Temporada", "PaixaoFlix-Stranger-Things-4a-Temporada", "PaixaoFlix-Stranger-Things-4a-Temporada-2022-VOLUME-2"] },
      exceto: { dom: { n: "Invencível", id: "invenciveldublado" } }
    }
  ];

  let gradeAutomated = [];
  let indiceAtual = -1;

  function converterParaSegundos(val) {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    if (typeof val === 'string') {
      if (val.includes(':')) {
        const partes = val.split(':').map(Number);
        if (partes.length === 3) return partes[0] * 3600 + partes[1] * 60 + partes[2];
        if (partes.length === 2) return partes[0] * 60 + partes[1];
      }
      return parseFloat(val) || 0;
    }
    return 0;
  }

  function horaParaMinutos(horarioStr) {
    const [h, m] = horarioStr.split(':').map(Number);
    return h * 60 + m;
  }

  function limparTimerReconexao() {
    if (timerReconexao) {
      clearInterval(timerReconexao);
      timerReconexao = null;
    }
  }

  function toggleGrade() {
    const box = document.getElementById('grade-box-container');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  function atualizarListaGrade() {
    const container = document.getElementById('grade-lista');
    if (!container) return;

    container.innerHTML = gradeAutomated.map((item, i) => `
      <div class="grade-item ${i === indiceAtual ? 'ativo' : ''}">
        <span><b>${item.h}</b> - ${item.n}</span>
        ${i === indiceAtual ? '<span>🔴 NO AR</span>' : ''}
      </div>
    `).join('');

    atualizarAseguirLista();
  }

  function atualizarAseguirLista() {
    const container = document.getElementById('a-seguir-lista');
    if (!container) return;

    const proximos = gradeAutomated.slice(indiceAtual + 1, indiceAtual + 5);
    
    if (proximos.length === 0) {
      container.innerHTML = `<div class="a-seguir-item"><span>Transmissão encerrada por hoje.</span></div>`;
      return;
    }

    container.innerHTML = proximos.map(p => `
      <div class="a-seguir-item">
        <span class="a-seguir-time">${p.h}</span>
        <span class="badge-classif">L</span>
        <span class="a-seguir-name">${p.n}</span>
      </div>
    `).join('');
  }

  async function carregarVideosArchive(idAlvo) {
    const colecoes = Array.isArray(idAlvo) ? idAlvo : [idAlvo];
    
    const requisicoes = colecoes.map(async (id) => {
      const maxTentativas = 3;
      let resposta = null;

      for (let tentativa = 1; tentativa <= maxTentativas; tentativa++) {
        try {
          let urlAPI = `https://archive.org/metadata/${id}`;
          if (tentativa === maxTentativas) {
            urlAPI = `https://api.allorigins.win/raw?url=${encodeURIComponent(urlAPI)}`;
          }

          resposta = await fetch(urlAPI);
          if (resposta.ok) break;
        } catch (e) {
          if (tentativa < maxTentativas) {
            await new Promise(r => setTimeout(r, 1000));
          }
        }
      }

      try {
        if (resposta && resposta.ok) {
          const dadosMeta = await resposta.json();
          if (dadosMeta.files) {
            let arquivos = dadosMeta.files.filter(f => 
              f.name && 
              (f.name.toLowerCase().endsWith('.ia.mp4') || f.name.toLowerCase().endsWith('_512kb.mp4'))
            );

            if (arquivos.length === 0) {
              arquivos = dadosMeta.files.filter(f => 
                f.name && 
                f.name.toLowerCase().endsWith('.mp4') && 
                !f.name.endsWith('_thumb.mp4') &&
                (f.format === 'h.264' || f.format === '512Kb MPEG4' || f.format === 'MPEG4' || !f.format)
              );
            }

            if (arquivos.length === 0) {
              arquivos = dadosMeta.files.filter(f => f.name && f.name.toLowerCase().endsWith('.mp4') && !f.name.endsWith('_thumb.mp4'));
            }
            
            let eps = arquivos
              .filter(f => {
                const dur = converterParaSegundos(f.length);
                if (dur > 0 && dur < 240) return false;
                if (id === "YuYuHakushoDublado" && dur > 2700) return false;
                if (id === "a-grande-familia-dvd" && dur < 1500) return false;
                return true;
              })
              .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            if (id === "naruto-shippuuden-021-720p") {
              eps = eps.slice(0, 79);
            }

            return eps.map(f => ({
              titulo: f.title || f.name.replace(/(\.ia)?\.mp4$/i, ''),
              url: `https://archive.org/download/${id}/${encodeURIComponent(f.name)}`,
              duracao: converterParaSegundos(f.length)
            }));
          }
        }
        return [];
      } catch (erro) {
        return [];
      }
    });

    const resultados = await Promise.all(requisicoes);
    return resultados.flat();
  }

  function getSlotParaDia(slot, siglaDia) {
    if (slot.exceto && slot.exceto[siglaDia]) return slot.exceto[siglaDia];
    return slot.padrao;
  }

  function getDuracaoParaDia(slot, siglaDia) {
    if (typeof slot.dur === 'number') return slot.dur;
    if (slot.dur[siglaDia]) return slot.dur[siglaDia];
    return slot.dur.padrao;
  }

  async function inicializarGradeAutomatica() {
    gradeAutomated = [];
    const hoje = new Date();
    const diaDaSemana = DIAS_SEMANA[hoje.getDay()];

    GRADE_UNIFICADA.forEach((slot) => {
      const progInfo = getSlotParaDia(slot, diaDaSemana);
      if (!progInfo) return;

      const mInicio = horaParaMinutos(slot.h);
      const duracao = getDuracaoParaDia(slot, diaDaSemana);
      const mFim = mInicio + duracao;

      gradeAutomated.push({
        h: slot.h,
        m: mInicio,
        mFim: mFim,
        n: progInfo.n,
        u: URL_VIDEO_INTERVALO,
        idArchive: progInfo.id,
        listaEpisodios: [],
        epIndexAtual: 0
      });
    });

    gradeAutomated.sort((a, b) => a.m - b.m);
    atualizarListaGrade();

    const player = document.getElementById('player');
    if (player) {
      player.onended = function() {
        if (!player.loop) {
          tocarProximoEpisodioSemCorte();
        }
      };
    }

    iniciarTransmissaoInicial();
  }

  function encerrarSinalMadrugada() {
    limparTimerReconexao();
    document.getElementById('current-time').innerText = "--:--";
    document.getElementById('current').innerText = "Transmissão Encerrada";
    document.getElementById('a-seguir-lista').innerHTML = `<div class="a-seguir-item"><span class="a-seguir-time">07:00</span><span class="a-seguir-name">Coragem, o Cão Covarde</span></div>`;
    
    const player = document.getElementById('player');
    if (player) {
      player.loop = false;
      player.pause();
      player.removeAttribute('src');
      player.load();
    }
  }

  async function iniciarTransmissaoInicial() {
    const agora = new Date();
    const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

    if (minutosHoje >= horaParaMinutos("23:00") || minutosHoje < horaParaMinutos("07:00")) {
      encerrarSinalMadrugada();
      return;
    }

    indiceAtual = gradeAutomated.findIndex(p => minutosHoje >= p.m && minutosHoje < p.mFim);

    if (indiceAtual !== -1) {
      const programa = gradeAutomated[indiceAtual];
      document.getElementById('current-time').innerText = programa.h;
      document.getElementById('current').innerText = programa.n;
      atualizarListaGrade();

      const episodios = await carregarVideosArchive(programa.idArchive);
      if (episodios.length > 0) {
        const diaDoAno = Math.floor((agora - new Date(agora.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        programa.listaEpisodios = episodios;
        programa.epIndexAtual = diaDoAno % episodios.length;
        programa.u = episodios[programa.epIndexAtual].url;
      }

      executarMidia(indiceAtual, true);
    } else {
      const proximoPrograma = gradeAutomated.find(p => p.m > minutosHoje);
      if (proximoPrograma) {
        exibirTelaIntervalo(proximoPrograma);
      } else {
        encerrarSinalMadrugada();
      }
    }
  }

  function tocarProximoEpisodioSemCorte() {
    const agora = new Date();
    const segundosHoje = agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();
    const limiteNoite = horaParaMinutos("23:00") * 60;
    const programaAtual = gradeAutomated[indiceAtual];

    if (programaAtual && segundosHoje < (programaAtual.mFim * 60)) {
      const segundosRestantesNoBloco = (programaAtual.mFim * 60) - segundosHoje;

      if (programaAtual.listaEpisodios && programaAtual.listaEpisodios.length > 1) {
        let epEncontradoIndex = -1;
        const proximoIndexPadrao = (programaAtual.epIndexAtual + 1) % programaAtual.listaEpisodios.length;
        const proximoEpPadrao = programaAtual.listaEpisodios[proximoIndexPadrao];
        const duracaoPadrao = proximoEpPadrao.duracao > 0 ? proximoEpPadrao.duracao : 420;

        if (duracaoPadrao <= segundosRestantesNoBloco) {
          epEncontradoIndex = proximoIndexPadrao;
        } else {
          for (let i = 0; i < programaAtual.listaEpisodios.length; i++) {
            const testEp = programaAtual.listaEpisodios[i];
            const duracaoTest = testEp.duracao > 0 ? testEp.duracao : 420;
            if (duracaoTest <= segundosRestantesNoBloco) {
              epEncontradoIndex = i;
              break;
            }
          }
        }

        if (epEncontradoIndex !== -1) {
          programaAtual.epIndexAtual = epEncontradoIndex;
          programaAtual.u = programaAtual.listaEpisodios[epEncontradoIndex].url;
          executarMidia(indiceAtual, false);
          return;
        }
      }
    }

    const proximoIndice = indiceAtual + 1;
    const proximoPrograma = gradeAutomated[proximoIndice];

    if (segundosHoje < limiteNoite) {
      if (proximoPrograma) {
        exibirTelaIntervalo(proximoPrograma);
      } else {
        exibirTelaIntervalo({ h: "23:00", m: 1380, n: "Transmissão Encerrada" });
      }
    } else {
      encerrarSinalMadrugada();
    }
  }

  function exibirTelaIntervalo(proximoPrograma) {
    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    etapaFallback = 0;
    
    document.getElementById('current-time').innerText = "--:--";
    document.getElementById('current').innerText = "Intervalo Comercial";
    
    const player = document.getElementById('player');
    
    player.onerror = function() {
      player.onerror = null;
    };

    player.loop = true;
    player.removeAttribute('crossorigin');
    player.src = URL_VIDEO_INTERVALO;
    
    player.muted = false;
    player.volume = 1.0;
    
    if (tvLigada) {
      player.play().then(() => { player.muted = false; }).catch(() => {});
    }

    const checarIntervalo = setInterval(async () => {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

      if (minutosHoje >= proximoPrograma.m) {
        clearInterval(checarIntervalo);
        limparTimerReconexao();
        player.loop = false;
        indiceAtual = gradeAutomated.indexOf(proximoPrograma);

        if (!proximoPrograma.listaEpisodios || proximoPrograma.listaEpisodios.length === 0) {
          const episodios = await carregarVideosArchive(proximoPrograma.idArchive);
          if (episodios.length > 0) {
            const diaDoAno = Math.floor((agora - new Date(agora.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            proximoPrograma.listaEpisodios = episodios;
            proximoPrograma.epIndexAtual = diaDoAno % episodios.length;
            proximoPrograma.u = episodios[proximoPrograma.epIndexAtual].url;
          }
        }

        executarMidia(indiceAtual, false);
      }
    }, 3000);
  }

  function tentarReconectarProgramaEmSegundoPlano(programa, index) {
    limparTimerReconexao();

    timerReconexao = setInterval(async () => {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

      if (minutosHoje >= programa.mFim) {
        limparTimerReconexao();
        return;
      }

      const idAlvo = programa.idArchive;
      const novosEpisodios = await carregarVideosArchive(idAlvo);

      if (novosEpisodios && novosEpisodios.length > 0) {
        limparTimerReconexao();
        programa.listaEpisodios = novosEpisodios;
        programa.epIndexAtual = Math.floor((agora - new Date(agora.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24)) % novosEpisodios.length;
        programa.u = novosEpisodios[programa.epIndexAtual].url;
        executarMidia(index, true);
      }
    }, 30000);
  }

  function aplicarEstrategiaFallback(programa, index) {
    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    etapaFallback++;

    const player = document.getElementById('player');
    const urlOriginal = programa.listaEpisodios && programa.listaEpisodios.length > 0
      ? programa.listaEpisodios[programa.epIndexAtual].url
      : programa.u;

    if (etapaFallback === 1) {
      player.src = `${urlOriginal}?retry=${Date.now()}`;
    } else if (etapaFallback === 2) {
      player.src = urlOriginal.replace("archive.org/download/", "ia801501.us.archive.org/items/");
    } else if (etapaFallback === 3) {
      player.src = `https://api.allorigins.win/raw?url=${encodeURIComponent(urlOriginal)}`;
    } else {
      etapaFallback = 0;
      tratarErroOuDemora(programa);
      return;
    }

    timeoutCarregamento = setTimeout(() => {
      if (player.readyState === 0) {
        aplicarEstrategiaFallback(programa, index);
      }
    }, STEP_TIMEOUT_MS);
  }

  function executarMidia(index, sincronizarSegundos) {
    limparTimerReconexao();
    const programa = gradeAutomated[index];
    if (!programa) return;

    if (programa.listaEpisodios && programa.listaEpisodios.length > 0) {
      programa.u = programa.listaEpisodios[programa.epIndexAtual].url;
    }

    const player = document.getElementById('player');
    player.loop = false;
    player.removeAttribute('crossorigin');

    document.getElementById('current-time').innerText = programa.h;
    document.getElementById('current').innerText = programa.n;

    atualizarListaGrade();

    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);

    player.onerror = function() {
      if (player.src && player.src.includes(URL_VIDEO_INTERVALO)) return;
      const err = player.error;
      const errCode = err ? err.code : 0;

      if (errCode === 2 && etapaFallback < 3) {
        etapaFallback = 2;
      }
      aplicarEstrategiaFallback(programa, index);
    };

    timeoutCarregamento = setTimeout(() => {
      if (player.readyState === 0) {
        aplicarEstrategiaFallback(programa, index);
      }
    }, STEP_TIMEOUT_MS);

    player.oncanplay = function() {
      if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
      etapaFallback = 0;
    };

    if (etapaFallback === 0) {
      player.src = programa.u;
    }

    player.muted = false;
    player.volume = 1.0;

    if (sincronizarSegundos) {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();
      const segundosHoje = agora.getSeconds();
      const minutosDecorridos = minutosHoje - programa.m;
      const segundosDecorridos = (minutosDecorridos * 60) + segundosHoje;

      player.addEventListener('loadedmetadata', function() {
        if (segundosDecorridos >= player.duration) {
          const proximoPrograma = gradeAutomated[index + 1];
          if (proximoPrograma) {
            exibirTelaIntervalo(proximoPrograma);
          } else {
            const limiteNoite = horaParaMinutos("23:00") * 60;
            const segHoje = agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();
            if (segHoje < limiteNoite) {
              exibirTelaIntervalo({ h: "23:00", m: 1380, n: "Transmissão Encerrada" });
            } else {
              encerrarSinalMadrugada();
            }
          }
        } else if (segundosDecorridos > 0) {
          player.currentTime = segundosDecorridos;
          if (tvLigada) {
            player.play().then(() => { player.muted = false; }).catch(() => {});
          }
        }
      }, { once: true });
    } else {
      if (tvLigada) {
        player.play().then(() => { player.muted = false; }).catch(() => {});
      }
    }
  }

  function tratarErroOuDemora(programa) {
    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    etapaFallback = 0;

    const index = gradeAutomated.indexOf(programa);
    const proximoPrograma = gradeAutomated[index + 1];
    
    const agora = new Date();
    const segundosHoje = agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();
    const limiteNoite = horaParaMinutos("23:00") * 60;

    if (segundosHoje < limiteNoite) {
      if (proximoPrograma) {
        exibirTelaIntervalo(proximoPrograma);
      } else {
        exibirTelaIntervalo({ h: "23:00", m: 1380, n: "Transmissão Encerrada" });
      }
      tentarReconectarProgramaEmSegundoPlano(programa, index);
    } else {
      encerrarSinalMadrugada();
    }
  }

  function ligarTelevisao() {
    tvLigada = true;
    document.getElementById('tela-start').style.display = 'none';
    const player = document.getElementById('player');
    
    player.muted = false;
    player.volume = 1.0;
    
    player.play().then(() => { player.muted = false; }).catch(() => {});
  }

  function toggleFullScreen() {
    const modulo = document.getElementById('modulo-tv');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (modulo.requestFullscreen) modulo.requestFullscreen();
      else if (modulo.webkitRequestFullscreen) modulo.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  window.addEventListener('DOMContentLoaded', inicializarGradeAutomatica);
</script>
