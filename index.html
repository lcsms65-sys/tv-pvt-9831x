  function converterParaSegundos(val) {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    if (typeof val === 'string') {
      if (val.includes(':')) {
        const partes = val.split(':').map(Number);
        if (partes.length === 3) return partes[0] * 3600 + partes[1] * 60 + partes[2];
        if (partes.length === 2) return partes[0] * 60 + partes[1];
      }
      return parseFloat(val) || 0;
    }
    return 0;
  }

  function horaParaMinutos(horarioStr) {
    const [h, m] = horarioStr.split(':').map(Number);
    return h * 60 + m;
  }

  function limparTimerReconexao() {

  async function carregarVideosArchive(idAlvo) {
    const colecoes = Array.isArray(idAlvo) ? idAlvo : [idAlvo];
    
    const requisicoes = colecoes.map(async (id) => {
      try {
        let urlAPI = `https://archive.org/metadata/${id}`;
        let resposta = await fetch(urlAPI);

        if (!resposta.ok) {
          urlAPI = `https://api.allorigins.win/raw?url=${encodeURIComponent(urlAPI)}`;
          resposta = await fetch(urlAPI);
        }

        if (resposta.ok) {
          const dadosMeta = await resposta.json();
          if (dadosMeta.files) {
            let arquivos = dadosMeta.files.filter(f => 
              f.name && 
              f.name.toLowerCase().endsWith('.mp4') && 
              !f.name.endsWith('_thumb.mp4') &&
              (f.format === 'h.264' || f.format === '512Kb MPEG4' || f.format === 'MPEG4' || !f.format)
            );

            if (arquivos.length === 0) {
              arquivos = dadosMeta.files.filter(f => f.name && f.name.toLowerCase().endsWith('.mp4') && !f.name.endsWith('_thumb.mp4'));
            }
            
            let eps = arquivos.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            return eps.map(f => ({
              titulo: f.title || f.name.replace(/\.mp4$/i, ''),
              url: `https://archive.org/download/${id}/${encodeURIComponent(f.name)}`,
              duracao: converterParaSegundos(f.length)
            }));
          }
        }
        return [];
      } catch (erro) {
        console.error("Erro ao buscar metadados no Archive:", erro);
        return [];
      }
    });

    const resultados = await Promise.all(requisicoes);
    return resultados.flat();
  }

  async function inicializarGradeAutomatica() {
    gradeAutomated = [];
    const hoje = new Date();
    const diaDaSemana = DIAS_SEMANA[hoje.getDay()];
    const diaDoAno = Math.floor((hoje - new Date(hoje.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));

    const promessasProgs = programacaoConfig.map(async (prog) => {
      const nomeAlvo = (typeof prog.nomePrograma === 'object' && prog.nomePrograma !== null)
        ? prog.nomePrograma[diaDaSemana]
        : prog.nomePrograma;

      const idAlvo = (typeof prog.idArchive === 'object' && prog.idArchive !== null && !Array.isArray(prog.idArchive))
        ? prog.idArchive[diaDaSemana]
        : prog.idArchive;

      if (!idAlvo || !nomeAlvo) return null;

      const mInicio = horaParaMinutos(prog.horarioInicio);
      const mFim = mInicio + prog.duracaoMinutos;

      const episodios = await carregarVideosArchive(idAlvo);
      
      let epIndexInicial = 0;
      let urlEp = URL_VIDEO_INTERVALO;
      if (episodios.length > 0) {
        epIndexInicial = diaDoAno % episodios.length;
        urlEp = episodios[epIndexInicial].url;
      }

      return {
        h: prog.horarioInicio,
        m: mInicio,
        mFim: mFim,
        n: nomeAlvo,
        u: urlEp,
        listaEpisodios: episodios,
        epIndexAtual: epIndexInicial
      };
    });

    const resultadosGerais = await Promise.all(promessasProgs);
    
    gradeAutomated = resultadosGerais.filter(item => item !== null).sort((a, b) => a.m - b.m);

    gradeAutomated.forEach((item, idx) => {
      item.proximo = gradeAutomated[idx + 1] ? `${gradeAutomated[idx + 1].h} - ${gradeAutomated[idx + 1].n}` : "22:00 - Transmissão Encerrada";
    });
    
    const player = document.getElementById('player');
    if (player) {
      player.onended = function() {
        if (!player.loop) {
          tocarProximoEpisodioSemCorte();
        }
      };
    }

    iniciarTransmissaoInicial();
  }

  function encerrarSinalMadrugada() {
    limparTimerReconexao();
    document.getElementById('current').innerText = "😴 Transmissão Encerrada (Voltamos às 07:00)";
    document.getElementById('next').innerText = "📺 07:00 - Coragem, o Cão Covarde";
    const player = document.getElementById('player');
    if (player) {
      player.loop = false;
      player.pause();
      player.removeAttribute('src');
      player.load();
    }
  }

  function iniciarTransmissaoInicial() {
    const agora = new Date();
    const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

    if (minutosHoje >= horaParaMinutos("22:00") || minutosHoje < horaParaMinutos("07:00")) {
      encerrarSinalMadrugada();
      return;
    }

    indiceAtual = -1;
    for (let i = 0; i < gradeAutomated.length; i++) {
      if (minutosHoje >= gradeAutomated[i].m && minutosHoje < gradeAutomated[i].mFim) {
        indiceAtual = i;
        break;
      }
    }

    if (indiceAtual !== -1) {
      executarMidia(indiceAtual, true);
    } else {
      const proximoPrograma = gradeAutomated.find(p => p.m > minutosHoje);
      if (proximoPrograma) {
        exibirTelaIntervalo(proximoPrograma);
      } else {
        encerrarSinalMadrugada();
      }
    }
  }

  function tocarProximoEpisodioSemCorte() {
    const agora = new Date();
    const segundosHoje = agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();
    const programaAtual = gradeAutomated[indiceAtual];

    if (programaAtual && segundosHoje < (programaAtual.mFim * 60)) {
      const segundosRestantesNoBloco = (programaAtual.mFim * 60) - segundosHoje;

      if (programaAtual.listaEpisodios && programaAtual.listaEpisodios.length > 1) {
        const proximoEpIndex = (programaAtual.epIndexAtual + 1) % programaAtual.listaEpisodios.length;
        const proximoEp = programaAtual.listaEpisodios[proximoEpIndex];

        const duracaoProximoEp = proximoEp.duracao > 0 ? proximoEp.duracao : 420;

        if (duracaoProximoEp <= segundosRestantesNoBloco) {
          programaAtual.epIndexAtual = proximoEpIndex;
          programaAtual.u = proximoEp.url;
          console.log(`✅ O próximo curta tem ${Math.round(duracaoProximoEp/60)} min e CABE nos ${Math.round(segundosRestantesNoBloco/60)} min restantes. Reproduzindo...`);
          executarMidia(indiceAtual, false);
          return;
        } else {
          console.log(`🛑 O próximo curta tem ${Math.round(duracaoProximoEp/60)} min e NÃO CABE nos ${Math.round(segundosRestantesNoBloco/60)} min restantes. Chamando o intervalo...`);
          const proximoPrograma = gradeAutomated[indiceAtual + 1];
          if (proximoPrograma) {
            exibirTelaIntervalo(proximoPrograma);
            return;
          }
        }
      }
    }

    const proximoIndice = indiceAtual + 1;
    const proximoPrograma = gradeAutomated[proximoIndice];

    if (proximoPrograma && segundosHoje < (horaParaMinutos("22:00") * 60)) {
      if (segundosHoje < (proximoPrograma.m * 60)) {
        exibirTelaIntervalo(proximoPrograma);
      } else {
        indiceAtual = proximoIndice;
        executarMidia(indiceAtual, false);
      }
    } else {
      encerrarSinalMadrugada();
    }
  }

  function exibirTelaIntervalo(proximoPrograma) {
    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    document.getElementById('current').innerText = "⏸️ Intervalo Comercial";
    document.getElementById('next').innerText = `${proximoPrograma.h} - ${proximoPrograma.n}`;
    
    const player = document.getElementById('player');
    delete player.dataset.tentouProxy;
    
    player.onerror = function() {
      console.error("Erro ao carregar vídeo de intervalo local. Aguardando a hora do próximo programa...");
      player.onerror = null;
    };

    player.loop = true;
    player.removeAttribute('crossorigin');
    player.src = URL_VIDEO_INTERVALO;
    
    player.muted = false;
    player.volume = 1.0;
    
    if (tvLigada) {
      player.play().then(() => { player.muted = false; }).catch(() => {});
    }

    const checarIntervalo = setInterval(() => {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

      if (minutosHoje >= proximoPrograma.m) {
        clearInterval(checarIntervalo);
        limparTimerReconexao();
        player.loop = false;
        indiceAtual = gradeAutomated.indexOf(proximoPrograma);
        executarMidia(indiceAtual, false);
      }
    }, 3000);
  }

  function tentarReconectarProgramaEmSegundoPlano(programa, index) {
    limparTimerReconexao();

    timerReconexao = setInterval(() => {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();

      if (minutosHoje >= programa.mFim) {
        limparTimerReconexao();
        return;
      }

      console.log(`🔄 [Reconexão Auto] Testando sinal do programa "${programa.n}" em segundo plano...`);

      const testVideo = document.createElement('video');
      testVideo.preload = 'metadata';

      let tentouProxyTeste = false;

      testVideo.oncanplay = function() {
        console.log(`✅ [Reconexão Auto] Sinal de "${programa.n}" recuperado! Retornando à transmissão normal...`);
        limparTimerReconexao();
        testVideo.removeAttribute('src');
        testVideo.load();
        executarMidia(index, true);
      };

      testVideo.onerror = function() {
        if (!tentouProxyTeste) {
          tentouProxyTeste = true;
          testVideo.src = `https://corsproxy.io/?${encodeURIComponent(programa.u)}`;
        } else {
          console.warn(`⏳ [Reconexão Auto] Servidor indisponível para "${programa.n}". Nova tentativa em 20 segundos...`);
          testVideo.removeAttribute('src');
          testVideo.load();
        }
      };

      testVideo.src = programa.u;
    }, 20000);
  }

  function executarMidia(index, sincronizarSegundos) {
    limparTimerReconexao();
    const programa = gradeAutomated[index];
    if (!programa) return;

    if (programa.listaEpisodios && programa.listaEpisodios.length > 0) {
      programa.u = programa.listaEpisodios[programa.epIndexAtual].url;
    }

    const player = document.getElementById('player');
    player.loop = false;
    player.removeAttribute('crossorigin');
    delete player.dataset.tentouProxy;

    document.getElementById('current').innerText = programa.n;
    document.getElementById('next').innerText = programa.proximo;

    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);

    player.onerror = function(e) {
      if (player.error) {
        const codigosErro = {
          1: "DOWNLOAD_ABORTADO (A reprodução foi cancelada)",
          2: "ERRO_DE_REDE (Servidor do Archive demorou ou cortou a conexão)",
          3: "ERRO_DE_DECODIFICACAO (Arquivo ou codec corrompido)",
          4: "FORMATO_NAO_SUPORTADO (Browser não suporta o codec deste arquivo)"
        };
        console.error(`❌ Falha no programa (${programa.n}):`, codigosErro[player.error.code] || player.error.code);
      }

      if (player.src && player.src.includes(URL_VIDEO_INTERVALO)) {
        return;
      }

      if (!player.dataset.tentouProxy) {
        player.dataset.tentouProxy = "true";
        console.warn(`⚠️ Falha ao carregar link direto de "${programa.n}". Tentando via Proxy...`);
        player.src = `https://corsproxy.io/?${encodeURIComponent(programa.u)}`;
        return;
      }

      delete player.dataset.tentouProxy;
      tratarErroOuDemora(programa);
    };

    timeoutCarregamento = setTimeout(() => {
      if (player.readyState === 0) {
        console.warn(`⏳ Servidor do Archive excedeu o limite de 60s sem responder para: ${programa.n}. Alternando para intervalo...`);
        tratarErroOuDemora(programa);
      }
    }, 60000);

    player.oncanplay = function() {
      if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    };

    player.src = programa.u;
    
    player.muted = false;
    player.volume = 1.0;

    if (sincronizarSegundos) {
      const agora = new Date();
      const minutosHoje = agora.getHours() * 60 + agora.getMinutes();
      const segundosHoje = agora.getSeconds();
      const minutosDecorridos = minutosHoje - programa.m;
      const segundosDecorridos = (minutosDecorridos * 60) + segundosHoje;

      player.addEventListener('loadedmetadata', function() {
        if (segundosDecorridos >= player.duration) {
          const proximoPrograma = gradeAutomated[index + 1];
          if (proximoPrograma) {
            exibirTelaIntervalo(proximoPrograma);
          } else {
            encerrarSinalMadrugada();
          }
        } else if (segundosDecorridos > 0) {
          player.currentTime = segundosDecorridos;
          if (tvLigada) {
            player.play().then(() => { player.muted = false; }).catch(err => console.log("Aguardando interação do usuário...", err));
          }
        }
      }, { once: true });
    } else {
      if (tvLigada) {
        player.play().then(() => { player.muted = false; }).catch(err => console.log("Aguardando interação...", err));
      }
    }
  }

  function tratarErroOuDemora(programa) {
    if (timeoutCarregamento) clearTimeout(timeoutCarregamento);
    const index = gradeAutomated.indexOf(programa);
    const proximoPrograma = gradeAutomated[index + 1];
    
    if (proximoPrograma) {
      exibirTelaIntervalo(proximoPrograma);
      tentarReconectarProgramaEmSegundoPlano(programa, index);
    } else {
      encerrarSinalMadrugada();
    }
  }

  function ligarTelevisao() {
    tvLigada = true;
    document.getElementById('tela-start').style.display = 'none';
    const player = document.getElementById('player');
    
    player.muted = false;
    player.volume = 1.0;
    
    player.play().then(() => { player.muted = false; }).catch(err => console.log("Erro ao reproduzir ao ligar:", err));
  }

  function toggleFullScreen() {
    const modulo = document.getElementById('modulo-tv');
    if (!document.fullscreenElement) {
      if (modulo.requestFullscreen) modulo.requestFullscreen();
      else if (modulo.webkitRequestFullscreen) modulo.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  window.addEventListener('DOMContentLoaded', inicializarGradeAutomatica);
</script>
